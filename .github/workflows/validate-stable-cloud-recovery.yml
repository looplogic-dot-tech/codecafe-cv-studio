name: Validate stable cloud recovery

on:
  push:
    branches:
      - fix/cloud-recovery-from-e4d09fe

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact stable-fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only requested changes
        run: python3 deploy/apply-cloud-recovery-from-stable.py

      - name: Run Python regression tests
        run: python3 -m unittest discover -s server -p 'test_*.py' -v

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Publish validated source and dist back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/workspace.ts server/test_cloud_recovery_from_stable.py dist
          if git diff --cached --quiet; then
            echo "No generated changes to publish"
            exit 0
          fi
          git commit -m "Apply requested cloud recovery fixes to stable e4d09fe"
          git pull --rebase origin fix/cloud-recovery-from-e4d09fe
          git push origin HEAD:fix/cloud-recovery-from-e4d09fe

# This workflow exists only on the isolated branch created from e4d09fe.
