# Esta ubicación pertenece únicamente al bloque HTTPS de cv.codecafe.io.
# Envía las solicitudes /api/ al servicio privado que escucha en 127.0.0.1:5002.
location /api/ {
    # El servicio no queda expuesto directamente a Internet; NGINX es su única entrada.
    proxy_pass http://127.0.0.1:5002;

    # Conserva la información del dominio y de la dirección original para auditoría.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Limita el tamaño de cada respaldo; permite incluir una fotografía razonable.
    client_max_body_size 12m;

    # Evita que una falla de la API mantenga conexiones abiertas indefinidamente.
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
